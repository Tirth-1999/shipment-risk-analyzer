[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dispatch-risk-takehome"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "joblib>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
all = [
    "pytest>=8.0",
    "jupyter>=1.0",
    "matplotlib>=3.8",
    "pandas>=2.1",
    "streamlit>=1.32",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
filterwarnings = [
    "ignore:Could not find the number of physical cores:UserWarning",
]
